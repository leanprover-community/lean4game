# nginx configuration for Lean Games, see `doc/server/setup.md`.
#
# nginx handles HTTPS and anonymized logging and forwards all requests to the Node server,
# which pm2 runs on 127.0.0.1:8000 (see `ecosystem.config.cjs`). The Node server serves both
# the API and the built client, so this file doesn't need to change for new endpoints.
#
# Adjust `server_name` and the certificate paths to your server.

# Anonymize IP addresses in the access log: the last part of IPv4 addresses and everything
# after the first two groups of IPv6 addresses is removed.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
    ~(?P<ip>[^:]+:[^:]+):       $ip::;
    127.0.0.1                   $remote_addr;
    ::1                         $remote_addr;
    default                     0.0.0.0;
}

log_format anonymized '$remote_addr_anon - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    server_name leangame.example.com;

    listen 443 ssl;
    ssl_certificate     /home/leangame/leangame_example_com_cert.cer;
    ssl_certificate_key /etc/ssl/private/private.pem;

    access_log /var/log/nginx/access.log anonymized;
    # the error log would contain unanonymized IP addresses
    error_log /dev/null crit;

    # Everything goes to the Node server, which also serves the built client. The client's
    # IP address is not forwarded, the server doesn't need it.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # proof checks may take up to `LEAN_CHECK_TIMEOUT_MS` (2 min by default)
        proxy_read_timeout 180s;
        # proof checks are small JSON requests
        client_max_body_size 1m;
    }

    # To restrict the statistics, e.g. to the server itself:
    # location /stats/ {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    # }
}

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
