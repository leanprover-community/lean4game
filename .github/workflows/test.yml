name: Test
run-name: Test the project
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 26
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        browser:
          - electron
          # - chrome
          # - firefox
          # - webkit
          # - chromium
        # exclude:
        #   - os: macos-latest
        #     browser: chromium
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    name: ${{ matrix.name }} - ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - name: Setup firefox (macOS)
        if: matrix.os == 'macos-latest' && matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build: true
          test: true
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          check-reservoir-eligibility: false
          lake-package-directory: 'server/lean'

      - run: elan default stable

      - name: Build the project
        run: |
          npm install
          npm run build

      - name: Run Cypress tests (Development mode)
        run: npm run test

      - name: Install Bubblewrap
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Configure AppArmor for Bubblewrap (https://etbe.coker.com.au/2024/04/24/ubuntu-24-04-bubblewrap/)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null << 'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/bwrap>
          }
          EOF
          sudo systemctl reload apparmor

      # the dev servers of the previous step can survive `concurrently -k` and keep the ports busy
      - name: Stop leftover dev servers
        if: matrix.os == 'ubuntu-latest'
        run: |
          for port in 3000 8000; do
            pids=$(lsof -ti tcp:$port || true)
            if [[ -n "$pids" ]]; then
              echo "Killing processes on port $port: $pids"
              kill $pids || true
            fi
          done

      - name: Run Cypress tests (Production mode)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:prod

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'cypress-screenshots-${{ matrix.name }}-${{ matrix.browser }}'
          path: cypress/screenshots
          retention-days: 2
          if-no-files-found: ignore

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      # all rules are warnings, shown as annotations in the PR
      - name: Lint
        continue-on-error: true
        run: npm run lint -- --format=github

      - name: Check formatting
        continue-on-error: true
        run: npm run fmt:check

      - name: Check translations
        continue-on-error: true
        run: npm run i18n:check

  all:
    name: all
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Matrix failed"
            exit 1
          fi
